<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Meal Plan 2</title>
<style>
:root{
  --bg:#0f1a14;--bg2:#162010;--card:#1c2b1e;--border:#2d4030;
  --ink:#eef5ee;--ink-soft:#8aab8e;--ink-faint:#3d5540;
  --accent:#7ec87a;--accent-dark:#4a9446;--accent-glow:rgba(126,200,122,0.15);
  --red:#e07060;--yellow:#e8c06a;--blue:#6aa8d8;--orange:#e8956a;
  --purple:#b088d8;--pink:#e088a8;--teal:#68c8b8;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overscroll-behavior:none;}
.nav{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(var(--safe-top)+10px) 16px 0;}
.nav-title{font-size:20px;font-weight:700;letter-spacing:-0.3px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.nav-title em{color:var(--accent);font-style:normal;}
.tabs{display:flex;}
.tab{flex:1;text-align:center;padding:10px 4px;font-size:12px;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;user-select:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.page{display:none;padding:16px 16px calc(var(--safe-bottom)+80px);}
.page.active{display:block;}
.budget-bar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:16px;}
.budget-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.budget-label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:0.5px;text-transform:uppercase;}
.budget-num{font-size:20px;font-weight:700;}
.budget-num small{font-size:13px;color:var(--ink-soft);font-weight:400;}
.budget-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.budget-fill{height:100%;border-radius:3px;background:var(--accent);transition:width 0.4s ease,background 0.3s;}
.budget-fill.warn{background:var(--yellow);}
.budget-fill.over{background:var(--red);}
.sec-hd{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin:16px 0 10px;}
.cuisine-scroll{overflow-x:auto;display:flex;gap:6px;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none;}
.cuisine-scroll::-webkit-scrollbar{display:none;}
.ctag{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--ink-soft);background:var(--bg2);user-select:none;transition:all 0.15s;}
.ctag.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.day-card.picked{border-color:var(--accent-dark);}
.day-hd{display:flex;align-items:center;padding:13px 14px;cursor:pointer;user-select:none;}
.day-name{font-size:13px;font-weight:700;min-width:82px;}
.day-meal{flex:1;font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 8px;}
.day-meal.set{color:var(--accent);}
.day-cost{font-size:12px;font-weight:700;color:var(--ink-faint);min-width:34px;text-align:right;}
.day-cost.set{color:var(--yellow);}
.picker{border-top:1px solid var(--border);padding:10px;display:none;flex-direction:column;gap:6px;}
.picker.open{display:flex;}

/* CHIP */
.chip{padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(–border);color:var(–ink-soft);background:var(–bg2);user-select:none;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between;}
.chip-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.chip-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:8px;}
.chip-meta{font-size:10px;opacity:0.6;white-space:nowrap;}
.spicy-note{font-size:11px;}
.expand-icon{font-size:10px;opacity:0.5;padding:2px 4px;}
.chip.sel{background:var(–accent-glow);border-color:var(–accent);color:var(–accent);}
.chip.mexican{border-color:#5a3a1a;}.chip.mexican.sel{background:rgba(232,149,106,0.15);border-color:var(–orange);color:var(–orange);}
.chip.italian{border-color:#1a3a5a;}.chip.italian.sel{background:rgba(106,168,216,0.15);border-color:var(–blue);color:var(–blue);}
.chip.japanese{border-color:#5a1a2a;}.chip.japanese.sel{background:rgba(224,136,168,0.15);border-color:var(–pink);color:var(–pink);}
.chip.thai{border-color:#3a1a5a;}.chip.thai.sel{background:rgba(176,136,216,0.15);border-color:var(–purple);color:var(–purple);}
.chip.indian{border-color:#5a3a1a;}.chip.indian.sel{background:rgba(232,192,106,0.15);border-color:var(–yellow);color:var(–yellow);}
.chip.mediterranean{border-color:#1a5a4a;}.chip.mediterranean.sel{background:rgba(104,200,184,0.15);border-color:var(–teal);color:var(–teal);}
.chip.american{border-color:#2a3a5a;}.chip.american.sel{background:rgba(106,168,216,0.15);border-color:var(–blue);color:var(–blue);}
.chip.chinese{border-color:#5a1a1a;}.chip.chinese.sel{background:rgba(224,112,96,0.15);border-color:var(–red);color:var(–red);}
.chip.healthy{border-color:#1a3a1a;}.chip.healthy.sel{background:rgba(126,200,122,0.15);border-color:var(–accent);color:var(–accent);}

/* RECIPE PANEL */
.recipe-panel{background:var(–bg);border:1px solid var(–border);border-radius:10px;overflow:hidden;display:none;margin-top:-4px;}
.recipe-panel.open{display:block;}
.recipe-header{padding:10px 12px 6px;font-size:12px;font-weight:700;color:var(–ink-soft);border-bottom:1px solid var(–border);}
.recipe-section{padding:8px 12px;border-bottom:1px solid var(–border);}
.recipe-section:last-of-type{border-bottom:none;}
.recipe-cat-label{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(–ink-faint);margin-bottom:5px;}
.recipe-tags{display:flex;flex-wrap:wrap;gap:4px;}
.rtag{font-size:11px;background:var(–card);border:1px solid var(–border);border-radius:6px;padding:3px 8px;color:var(–ink-soft);}
.recipe-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(–border);}
.btn-pick{flex:1;padding:10px;background:var(–accent);color:var(–bg);border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:-apple-system,sans-serif;}
.btn-close{padding:10px 14px;background:transparent;color:var(–ink-faint);border:1px solid var(–border);border-radius:10px;font-size:13px;cursor:pointer;font-family:-apple-system,sans-serif;}

.clear-btn{width:100%;margin-top:2px;padding:8px;border-radius:10px;background:transparent;border:1px dashed var(–border);color:var(–ink-faint);font-family:-apple-system,sans-serif;font-size:12px;cursor:pointer;}
.bfast-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.bfast-card{background:var(–card);border:1px solid var(–border);border-radius:14px;padding:12px;cursor:pointer;user-select:none;transition:all 0.15s;}
.bfast-card.sel{border-color:var(–accent);background:var(–accent-glow);}
.bfast-icon{font-size:20px;margin-bottom:4px;}
.bfast-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.bfast-detail{font-size:11px;color:var(–ink-soft);}
.bfast-cost{font-size:11px;font-weight:700;color:var(–yellow);margin-top:4px;}
.groc-summary{background:var(–card);border:1px solid var(–border);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;}
.groc-stat-label{font-size:12px;color:var(–ink-soft);margin-bottom:2px;}
.groc-stat-val{font-size:18px;font-weight:700;}
.copy-btn{width:100%;padding:14px;background:var(–accent);color:var(–bg);border:none;border-radius:14px;font-family:-apple-system,sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:14px;transition:background 0.2s;}
.copy-btn.done{background:var(–accent-dark);}
.ingr-block{background:var(–card);border:1px solid var(–border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.ingr-hd{padding:10px 14px;border-bottom:1px solid var(–border);display:flex;justify-content:space-between;}
.ingr-cat{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(–ink-soft);}
.ingr-ct{font-size:11px;color:var(–ink-faint);}
.ingr-row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(–border);font-size:13px;}
.ingr-row:last-child{border-bottom:none;}
.dot{width:6px;height:6px;border-radius:50%;background:var(–accent);margin-right:10px;flex-shrink:0;}
.empty{text-align:center;padding:40px 20px;color:var(–ink-faint);font-size:13px;line-height:1.6;}
.stock-intro{background:var(–card);border:1px solid var(–border);border-radius:14px;padding:14px;margin-bottom:14px;font-size:13px;color:var(–ink-soft);line-height:1.5;}
.flag-banner{background:rgba(224,112,96,0.1);border:1px solid rgba(224,112,96,0.3);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(–red);font-weight:600;display:none;}
.flag-banner.show{display:block;}
.stock-row{display:flex;align-items:center;background:var(–card);border:1px solid var(–border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;user-select:none;}
.stock-row.flagged{border-color:var(–red);background:rgba(224,112,96,0.08);}
.stock-icon{width:28px;height:28px;border-radius:8px;border:2px solid var(–border);display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0;font-size:14px;}
.stock-row.flagged .stock-icon{background:var(–red);border-color:var(–red);}
.stock-name{font-size:13px;font-weight:500;}
.stock-sub{font-size:11px;color:var(–ink-faint);margin-top:1px;}
</style>

</head>

];

var cuisines=['all','mexican','italian','japanese','thai','indian','mediterranean','chinese','american','healthy'];
var cuisineLabels={all:'🍽 All',mexican:'🌮 Mexican',italian:'🍝 Italian',japanese:'🍱 Japanese',thai:'🥜 Thai',indian:'🫕 Indian',mediterranean:'🫙 Mediter.',chinese:'🥢 Chinese',american:'🇺🇸 American',healthy:'🥬 Healthy'};
var dayMeals={Monday:null,Tuesday:null,Wednesday:null,Thursday:null,Friday:null};
var openDay=null,selBreakfast=null,flagged={};

function goPage(id,el){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='grocery') renderGrocery();
  if(id==='stock') renderStock();
}

function totalCost(){
  var c=0;
  DAYS.forEach(function(d){if(dayMeals[d]) c+=dayMeals[d].cost;});
  if(selBreakfast) c+=selBreakfast.cost*2;
  return c;
}

function updateBudget(){
  var cost=totalCost(),pct=Math.min(100,(cost/BUDGET)*100);
  document.getElementById('bAmt').innerHTML='$'+cost+' <small>/ $'+BUDGET+'</small>';
  var f=document.getElementById('bFill');
  f.style.width=pct+'%';
  f.className='budget-fill'+(pct>=100?' over':pct>=80?' warn':'');
}

function buildRecipeHTML(m){
  var html='<div class="recipe-header">📋 '+m.emoji+' '+m.name+' — Ingredients</div>';
  Object.keys(m.ing).forEach(function(cat){
    html+='<div class="recipe-section"><div class="recipe-cat-label">'+cat+'</div><div class="recipe-tags">';
    m.ing[cat].forEach(function(item){html+='<span class="rtag">'+item+'</span>';});
    html+='</div></div>';
  });
  return html;
}

function renderPlan(){
  updateBudget();
  var html='';
  cuisines.forEach(function(c){html+='<div class="ctag'+(activeCuisine===c?' active':'')+'" data-cuisine="'+c+'">'+cuisineLabels[c]+'</div>';});
  document.getElementById('cuisineFilter').innerHTML=html;

  var filtered=activeCuisine==='all'?meals:meals.filter(function(m){return m.cat===activeCuisine;});
  var dHtml='';
  DAYS.forEach(function(day){
    var meal=dayMeals[day],isOpen=openDay===day;
    var chips='';
    filtered.forEach(function(m){
      var isSel=meal&&meal.id===m.id;
      var rkey=day+'-'+m.id;
      var rOpen=openRecipe===rkey;
      chips+=
        '<div class="chip '+m.cat+(isSel?' sel':'')+'" data-day="'+day+'" data-mid="'+m.id+'">'+
          '<div class="chip-left"><span>'+m.emoji+'</span><span class="chip-name">'+m.name+'</span>'+(m.spicy?'<span class="spicy-note">🌶️</span>':'')+' </div>'+
          '<div class="chip-right"><span class="chip-meta">$'+m.cost+' · '+m.time+'</span><span class="expand-icon" data-rkey="'+rkey+'">'+(rOpen?'▲':'▼')+'</span></div>'+
        '</div>'+
        '<div class="recipe-panel'+(rOpen?' open':'')+'">'+
          buildRecipeHTML(m)+
          '<div class="recipe-actions">'+
            '<button class="btn-pick" data-pday="'+day+'" data-pmid="'+m.id+'">✓ Add to '+day+'</button>'+
            '<button class="btn-close" data-rkey="'+rkey+'">Close</button>'+
          '</div>'+
        '</div>';
    });
    if(meal) chips+='<button class="clear-btn" data-clear="'+day+'">✕ Clear '+day+'</button>';
    dHtml+=
      '<div class="day-card'+(meal?' picked':'')+'">'+
        '<div class="day-hd" data-tog="'+day+'">'+
          '<div class="day-name">'+day+'</div>'+
          '<div class="day-meal'+(meal?' set':'')+'">'+( meal?meal.emoji+' '+meal.name:'tap to pick')+'</div>'+
          '<div class="day-cost'+(meal?' set':'')+'">'+( meal?'$'+meal.cost:'')+'</div>'+
        '</div>'+
        '<div class="picker'+(isOpen?' open':'')+'">'+chips+'</div>'+
      '</div>';
  });
  document.getElementById('dinnerDays').innerHTML=dHtml;

  var bHtml='';
  breakfasts.forEach(function(b){
    var isSel=selBreakfast&&selBreakfast.id===b.id;
    bHtml+='<div class="bfast-card'+(isSel?' sel':'')+'" data-bid="'+b.id+'"><div class="bfast-icon">'+b.emoji+'</div><div class="bfast-name">'+b.name+'</div><div class="bfast-detail">'+b.detail+'</div><div class="bfast-cost">~$'+b.cost+'/wk</div></div>';
  });
  document.getElementById('bfastGrid').innerHTML=bHtml;
}

document.getElementById('page-plan').addEventListener('click',function(e){
  var ctag=e.target.closest('[data-cuisine]');
  var rkey=e.target.closest('[data-rkey]');
  var pickBtn=e.target.closest('[data-pday]');
  var chip=e.target.closest('[data-mid]');
  var clr=e.target.closest('[data-clear]');
  var tog=e.target.closest('[data-tog]');
  var bid=e.target.closest('[data-bid]');

  if(ctag){activeCuisine=ctag.dataset.cuisine;renderPlan();}
  else if(pickBtn){
    var mid=parseInt(pickBtn.dataset.pmid);
    dayMeals[pickBtn.dataset.pday]=meals.find(function(m){return m.id===mid;});
    openDay=null;openRecipe=null;renderPlan();
  }
  else if(rkey){
    var k=rkey.dataset.rkey;
    openRecipe=openRecipe===k?null:k;
    renderPlan();
  }
  else if(chip&&!e.target.closest('[data-rkey]')&&!e.target.closest('[data-pday]')){
    var k2=chip.dataset.day+'-'+chip.dataset.mid;
    openRecipe=openRecipe===k2?null:k2;
    renderPlan();
  }
  else if(clr){dayMeals[clr.dataset.clear]=null;openDay=null;openRecipe=null;renderPlan();}
  else if(tog){openDay=openDay===tog.dataset.tog?null:tog.dataset.tog;openRecipe=null;renderPlan();}
  else if(bid){
    var found=breakfasts.find(function(b){return b.id===bid.dataset.bid;});
    selBreakfast=(selBreakfast&&selBreakfast.id===bid.dataset.bid)?null:found;
    renderPlan();
  }
});

function buildIngr(){
  var map={};
  function add(cat,items){if(!map[cat])map[cat]=[];items.forEach(function(i){if(map[cat].indexOf(i)<0)map[cat].push(i);});}
  DAYS.forEach(function(d){var meal=dayMeals[d];if(!meal)return;Object.keys(meal.ing).forEach(function(cat){add(cat,meal.ing[cat]);});});
  if(selBreakfast)Object.keys(selBreakfast.ing).forEach(function(cat){add(cat,selBreakfast.ing[cat]);});
  stockItems.forEach(function(s){if(flagged[s.id])add(s.cat,[s.name+' ⚠️ (low stock)']);});
  return map;
}

function renderGrocery(){
  var map=buildIngr(),cats=Object.keys(map);
  var total=cats.reduce(function(s,c){return s+map[c].length;},0);
  document.getElementById('gCount').textContent=total+' items';
  document.getElementById('gCost').textContent='$'+totalCost();
  if(!cats.length){document.getElementById('grocList').innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:10px">🛒</div>Pick meals on the Plan tab and your list appears here automatically.</div>';return;}
  var html='';
  cats.forEach(function(cat){
    html+='<div class="ingr-block"><div class="ingr-hd"><span class="ingr-cat">'+cat+'</span><span class="ingr-ct">'+map[cat].length+' items</span></div>';
    map[cat].forEach(function(item){html+='<div class="ingr-row"><div class="dot"></div><div>'+item+'</div></div>';});
    html+='</div>';
  });
  document.getElementById('grocList').innerHTML=html;
}

function copyGrocery(){
  var map=buildIngr(),lines=['🛒 Weekly Grocery List',''];
  Object.keys(map).forEach(function(cat){lines.push('── '+cat+' ──');map[cat].forEach(function(i){lines.push('  • '+i);});lines.push('');});
  lines.push('Est. budget: $'+totalCost()+' / $'+BUDGET);
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    var btn=document.getElementById('copyBtn');btn.textContent='✓ Copied!';btn.classList.add('done');
    setTimeout(function(){btn.textContent='📋 Copy Grocery List';btn.classList.remove('done');},2000);
  });
}

function renderStock(){
  var fl=stockItems.filter(function(s){return flagged[s.id];});
  var banner=document.getElementById('flagBanner');
  if(fl.length){banner.textContent='⚠️ '+fl.length+' item'+(fl.length>1?'s':'')+' flagged — added to grocery list';banner.classList.add('show');}
  else banner.classList.remove('show');
  var html='';
  stockItems.forEach(function(s){
    var f=flagged[s.id];
    html+='<div class="stock-row'+(f?' flagged':'')+'" data-sid="'+s.id+'"><div class="stock-icon">'+(f?'⚠️':'')+'</div><div><div class="stock-name">'+s.name+'</div><div class="stock-sub">'+(f?'Flagged · added to list':s.cat)+'</div></div></div>';
  });
  document.getElementById('stockList').innerHTML=html;
}

document.getElementById('page-stock').addEventListener('click',function(e){
  var row=e.target.closest('[data-sid]');
  if(!row)return;
  flagged[row.dataset.sid]=!flagged[row.dataset.sid];
  renderStock();
});

renderPlan();
</script>
